version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aicte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aicte_verify
      POSTGRES_USER: aicte_admin
      POSTGRES_PASSWORD: aicte_secure_password_2025
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte_admin -d aicte_verify"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aicte-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: aicte-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aicte-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aicte_admin:aicte_secure_password_2025@db:5432/aicte_verify
      SECRET_KEY: aicte_prod_jwt_secret_token_regulation_bureau_2025
      UPLOAD_DIR: /app/uploads
      STORAGE_TYPE: local
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicte-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  backend_uploads:
